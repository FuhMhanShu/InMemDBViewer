name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Minuten sparen: veraltete Laeufe desselben Branches abbrechen (aktuellster gewinnt)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cmake-qt6:
    name: CMake / Qt6 / Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: InMemDBViewer
      - name: InMemDB auschecken (privat; ohne INMEMDB_TOKEN nur bei per GITHUB_TOKEN gewaehrtem Zugriff)
        uses: actions/checkout@v4
        with:
          repository: FuhMhanShu/InMemDB
          path: InMemDBViewer/../InMemDB
          token: ${{ secrets.INMEMDB_TOKEN && secrets.INMEMDB_TOKEN || github.token }}
      - name: Qt6 installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools libgl1-mesa-dev
      - name: Konfigurieren und bauen
        run: |
          cmake -S InMemDBViewer -B build -DINMEMDB_DIR="$GITHUB_WORKSPACE/InMemDB"
          cmake --build build -j"$(nproc)"
      - name: Unit-Tests (headless)
        run: QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure
      - name: Demo-App Smoke-Test (headless)
        run: QT_QPA_PLATFORM=offscreen ./build/viewer_demo

  cmake-qt5:
    name: CMake / Qt5.15 / Ubuntu 22.04
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: InMemDBViewer
      - name: InMemDB auschecken (privat)
        uses: actions/checkout@v4
        with:
          repository: FuhMhanShu/InMemDB
          path: InMemDBViewer/../InMemDB
          token: ${{ secrets.INMEMDB_TOKEN && secrets.INMEMDB_TOKEN || github.token }}
      - name: Qt5 installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev qtbase5-dev-tools libgl1-mesa-dev
      - name: Konfigurieren und bauen
        run: |
          cmake -S InMemDBViewer -B build -DINMEMDB_DIR="$GITHUB_WORKSPACE/InMemDB"
          cmake --build build -j"$(nproc)"
      - name: Unit-Tests (headless)
        run: QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure

  qmake-qt6:
    name: qmake / Qt6 / Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: InMemDBViewer
      - name: InMemDB auschecken (privat)
        uses: actions/checkout@v4
        with:
          repository: FuhMhanShu/InMemDB
          path: InMemDBViewer/../InMemDB
          token: ${{ secrets.INMEMDB_TOKEN && secrets.INMEMDB_TOKEN || github.token }}
      - name: Qt6 installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools qt6-qmake 2>/dev/null || sudo apt-get install -y qt6-base-dev qt6-base-dev-tools
      - name: Bibliothek + Tests + Demo bauen (qmake6)
        run: |
          export QMAKE="$(command -v qmake6 || command -v /usr/lib/qt6/bin/qmake)"
          cd InMemDBViewer
          $QMAKE INMEMDB_DIR="$GITHUB_WORKSPACE/InMemDB" InMemDBViewer.pro && make -j"$(nproc)"
          mkdir -p build-tests && cd build-tests
          $QMAKE INMEMDB_DIR="$GITHUB_WORKSPACE/InMemDB" ../tests/tests.pro && make -j"$(nproc)"
          mkdir -p ../build-demo && cd ../build-demo
          $QMAKE INMEMDB_DIR="$GITHUB_WORKSPACE/InMemDB" ../examples/viewer_demo/viewer_demo.pro && make -j"$(nproc)"
      - name: Unit-Tests (headless)
        run: QT_QPA_PLATFORM=offscreen ./InMemDBViewer/build-tests/viewer_tests
      - name: Demo-App Smoke-Test (headless)
        run: QT_QPA_PLATFORM=offscreen ./InMemDBViewer/build-demo/viewer_demo
