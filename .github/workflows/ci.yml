name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Minuten sparen: veraltete Laeufe desselben Branches abbrechen (aktuellster gewinnt)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cmake-qt6:
    name: CMake / Qt6 / Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: InMemDBViewer
      - name: InMemDB auschecken (public, kein Secret noetig)
        uses: actions/checkout@v4
        with:
          repository: FuhMhanShu/InMemDB
          path: InMemDBViewer/../InMemDB
      - name: Qt6 + SQLite installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools qt6-svg-dev libsqlite3-dev libgl1-mesa-dev
      - name: Konfigurieren und bauen (inkl. SQLite-Import)
        run: |
          cmake -S InMemDBViewer -B build -DINMEMDB_DIR="$GITHUB_WORKSPACE/InMemDB" -DINMEMDBVIEWER_WITH_SQLITE=ON
          cmake --build build -j"$(nproc)"
      - name: Unit-Tests (headless)
        run: QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure
      - name: App Smoke-Test (headless)
        run: QT_QPA_PLATFORM=offscreen ./build/viewer_app

  cmake-qt5:
    name: CMake / Qt5.15 / Ubuntu 22.04
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: InMemDBViewer
      - name: InMemDB auschecken (public, kein Secret noetig)
        uses: actions/checkout@v4
        with:
          repository: FuhMhanShu/InMemDB
          path: InMemDBViewer/../InMemDB
      - name: Qt5 installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev qtbase5-dev-tools libqt5svg5-dev libgl1-mesa-dev
      - name: Konfigurieren und bauen
        run: |
          cmake -S InMemDBViewer -B build -DINMEMDB_DIR="$GITHUB_WORKSPACE/InMemDB"
          cmake --build build -j"$(nproc)"
      - name: Unit-Tests (headless)
        run: QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure

  qmake-qt6:
    name: qmake / Qt6 / Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: InMemDBViewer
      - name: InMemDB auschecken (public, kein Secret noetig)
        uses: actions/checkout@v4
        with:
          repository: FuhMhanShu/InMemDB
          path: InMemDBViewer/../InMemDB
      - name: Qt6 + SQLite installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools qt6-svg-dev qt6-qmake libsqlite3-dev 2>/dev/null || sudo apt-get install -y qt6-base-dev qt6-base-dev-tools qt6-svg-dev libsqlite3-dev
      - name: Bibliothek + Tests + App bauen (qmake6, mit SQLite-Import)
        run: |
          export QMAKE="$(command -v qmake6 || command -v /usr/lib/qt6/bin/qmake)"
          cd InMemDBViewer
          $QMAKE "INMEMDB_DIR=$GITHUB_WORKSPACE/InMemDB" "CONFIG+=viewer_sqlite" InMemDBViewer.pro && make -j"$(nproc)"
          mkdir -p build-tests && cd build-tests
          $QMAKE "INMEMDB_DIR=$GITHUB_WORKSPACE/InMemDB" "CONFIG+=viewer_sqlite" ../tests/tests.pro && make -j"$(nproc)"
          mkdir -p ../build-app && cd ../build-app
          $QMAKE "INMEMDB_DIR=$GITHUB_WORKSPACE/InMemDB" "CONFIG+=viewer_sqlite" ../examples/viewer_app/viewer_app.pro && make -j"$(nproc)"
      - name: Unit-Tests (headless)
        run: QT_QPA_PLATFORM=offscreen ./InMemDBViewer/build-tests/viewer_tests
      - name: App Smoke-Test (headless)
        run: QT_QPA_PLATFORM=offscreen ./InMemDBViewer/build-app/viewer_app
